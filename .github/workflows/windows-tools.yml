name: Windows host tools

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-unzbm:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build unzbm.exe
        shell: pwsh
        run: |
          @'
          #ifndef _UNISTD_H
          #define _UNISTD_H
          #include <io.h>
          #define unlink _unlink
          #endif
          '@ | Set-Content -LiteralPath xnu-deps/build/lzbitmap/unistd.h -Encoding ascii
          New-Item -ItemType Directory -Force -Path out | Out-Null
          cl /nologo /O2 /std:c11 /D_CRT_SECURE_NO_WARNINGS /Ixnu-deps\build\lzbitmap /Fe:out\unzbm.exe xnu-deps\build\lzbitmap\unzbm.c xnu-deps\build\lzbitmap\libzbitmap.c
          if (-not (Test-Path out\unzbm.exe)) { throw 'unzbm.exe was not produced' }
          Get-FileHash out\unzbm.exe -Algorithm SHA256
      - uses: actions/upload-artifact@v4
        with:
          name: lemonade-windows-host-tools
          path: out/unzbm.exe
          if-no-files-found: error
          retention-days: 7

  build-apfs-tool:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-zlib mingw-w64-x86_64-openssl make
      - name: Build apfs-tool.exe
        shell: msys2 {0}
        run: |
          mkdir -p out
          tools/apfs/build-tool.sh out/apfs-tool.exe
          test -f out/apfs-tool.exe
          sha256sum out/apfs-tool.exe
      - uses: actions/upload-artifact@v4
        with:
          name: lemonade-apfs-tool
          path: out/apfs-tool.exe
          if-no-files-found: error
          retention-days: 7
